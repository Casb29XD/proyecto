spring.application.name=proyecto
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/Documentos}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/Documentos}
# Tiempos de espera agresivos para activar el Fallback de inmediato si hay fallo
spring.mongodb.embedded.enabled=false
spring.data.mongodb.connect-timeout=1500
spring.data.mongodb.server-selection-timeout=1500

# Configuración de integración con motor de IA externo
similarity.ai.enabled=${SIMILARITY_AI_ENABLED:true}
similarity.ai.service-url=${AI_SERVICE_URL:http://ai-engine:8000}
similarity.ai.timeout-ms=${AI_SERVICE_TIMEOUT_MS:2500}
similarity.ai.max-retries=${AI_SERVICE_MAX_RETRIES:1}
similarity.ai.retry-delay-ms=${AI_SERVICE_RETRY_DELAY_MS:250}
