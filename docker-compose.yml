
services:
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WORD2VEC_MODEL_NAME=${WORD2VEC_MODEL_NAME:-glove-wiki-gigaword-50}
      - SBERT_MODEL_NAME=${SBERT_MODEL_NAME:-paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - model_cache:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Backend Spring Boot (Java 17)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-engine:8000}
      - SIMILARITY_AI_ENABLED=${SIMILARITY_AI_ENABLED:-true}
      - SPRING_DATA_MONGODB_DATABASE=${MONGODB_DATABASE:-Documentos}
      - MANAGEMENT_HEALTH_MONGO_ENABLED=false
      - MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS=always
    restart: unless-stopped
    depends_on:
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # Frontend React (Vite + Nginx)
  frontend:
    build:
      context: ./doc-central-app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model_cache:
